<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" role="img" aria-label="Baghewala digital twin system flow: field and synthetic data feed a physics engine, which feeds an ML layer, which feeds the digital twin dashboard, with set-points fed back to steam and pump control">
