<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="900" height="900" role="img" aria-label="Software stack for the Baghewala digital twin: Python NumPy SciPy foundation, XGBoost and scikit-optimize ML layer, FastAPI service layer, and a Plotly web dashboard on top, all open-source">
