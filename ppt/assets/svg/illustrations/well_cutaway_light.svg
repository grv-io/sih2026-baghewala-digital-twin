<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200" role="img" aria-label="Well cross-section, CSS well, Baghewala, light theme">
<title>Well Cross-Section — CSS Well, Baghewala</title>
<defs>
  <radialGradient id="wcSteamLight" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
  </radialGradient>
  <filter id="wcBlurLight" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="10"/>
  </filter>
</defs>

<text x="400" y="34" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#0f2540">Well Cross-Section — CSS Well, Baghewala</text>
<text x="400" y="56" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#3d5a75">Casing · tubing · sucker rod · downhole pump · steam-heated reservoir</text>

<!-- geology bands -->
<g stroke="#94a3b8" stroke-width="1.5">
  <rect x="30" y="160" width="630" height="209" fill="#eef2f6"/>
  <rect x="30" y="369" width="630" height="208" fill="#e2e8f0"/>
  <rect x="30" y="577" width="630" height="418" fill="#f3e6cf"/>
  <rect x="30" y="995" width="630" height="125" fill="#dbe2ea"/>
</g>

<g font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#0f2540">
  <text x="50" y="255">Surface alluvium</text>
  <text x="50" y="280" font-size="18" fill="#64748b">0 – 250 m</text>
  <text x="50" y="465">Caprock shale</text>
  <text x="50" y="490" font-size="18" fill="#64748b">250 – 500 m</text>
  <text x="50" y="770" fill="#b45309">Jodhpur Sandstone (reservoir)</text>
  <text x="50" y="795" font-size="18" fill="#64748b">500 – 1000 m</text>
  <text x="50" y="1050">Basal shale / basement</text>
  <text x="50" y="1075" font-size="18" fill="#64748b">1000 – 1150 m</text>
</g>

<!-- steam-heated halo -->
<ellipse cx="400" cy="830" rx="210" ry="170" fill="url(#wcSteamLight)" filter="url(#wcBlurLight)"/>
<text x="480" y="758" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#b45309">Steam-heated zone</text>

<!-- surface pumpjack icon -->
<g stroke="#0f2540" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <line x1="385" y1="155" x2="400" y2="72"/>
  <line x1="415" y1="155" x2="400" y2="72"/>
  <path d="M355,90 C340,88 330,96 333,108 C334,115 342,119 350,116 L360,105"/>
  <line x1="360" y1="105" x2="445" y2="80"/>
</g>
<rect x="388" y="150" width="24" height="10" rx="2" fill="#ffffff" stroke="#0f2540" stroke-width="2"/>

<!-- surface line -->
<line x1="30" y1="160" x2="660" y2="160" stroke="#0f2540" stroke-width="2.5"/>

<!-- casing / tubing -->
<g stroke="#0f2540" stroke-width="2.5" fill="none">
  <line x1="376" y1="160" x2="376" y2="1120"/>
  <line x1="424" y1="160" x2="424" y2="1120"/>
  <line x1="394" y1="200" x2="394" y2="870"/>
  <line x1="406" y1="200" x2="406" y2="870"/>
</g>

<!-- perforations -->
<g stroke="#b45309" stroke-width="2">
  <line x1="368" y1="700" x2="376" y2="700"/><line x1="424" y1="700" x2="432" y2="700"/>
  <line x1="368" y1="726" x2="376" y2="726"/><line x1="424" y1="726" x2="432" y2="726"/>
  <line x1="368" y1="752" x2="376" y2="752"/><line x1="424" y1="752" x2="432" y2="752"/>
  <line x1="368" y1="778" x2="376" y2="778"/><line x1="424" y1="778" x2="432" y2="778"/>
  <line x1="368" y1="804" x2="376" y2="804"/><line x1="424" y1="804" x2="432" y2="804"/>
  <line x1="368" y1="830" x2="376" y2="830"/><line x1="424" y1="830" x2="432" y2="830"/>
  <line x1="368" y1="856" x2="376" y2="856"/><line x1="424" y1="856" x2="432" y2="856"/>
  <line x1="368" y1="882" x2="376" y2="882"/><line x1="424" y1="882" x2="432" y2="882"/>
  <line x1="368" y1="908" x2="376" y2="908"/><line x1="424" y1="908" x2="432" y2="908"/>
  <line x1="368" y1="934" x2="376" y2="934"/><line x1="424" y1="934" x2="432" y2="934"/>
  <line x1="368" y1="960" x2="376" y2="960"/><line x1="424" y1="960" x2="432" y2="960"/>
</g>

<!-- sucker rod -->
<line x1="400" y1="170" x2="400" y2="860" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="10 8"/>

<!-- downhole pump -->
<rect x="385" y="860" width="30" height="55" rx="3" fill="#ffffff" stroke="#0f2540" stroke-width="2.5"/>
<circle cx="400" cy="876" r="4" fill="#f59e0b"/>
<circle cx="400" cy="900" r="4" fill="#f59e0b"/>

<!-- depth ruler -->
<line x1="700" y1="160" x2="700" y2="1120" stroke="#0f2540" stroke-width="2.5"/>
<g stroke="#b45309" stroke-width="2.5">
  <line x1="694" y1="160" x2="706" y2="160"/>
  <line x1="694" y1="369" x2="706" y2="369"/>
  <line x1="694" y1="577" x2="706" y2="577"/>
  <line x1="694" y1="786" x2="706" y2="786"/>
  <line x1="694" y1="995" x2="706" y2="995"/>
  <line x1="694" y1="1120" x2="706" y2="1120"/>
</g>
<g font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#0f2540">
  <text x="714" y="166">0 m</text>
  <text x="714" y="375">250 m</text>
  <text x="714" y="583">500 m</text>
  <text x="714" y="792">750 m</text>
  <text x="714" y="1001">1000 m</text>
  <text x="714" y="1126">1150 m</text>
</g>

<!-- legend -->
<g font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#0f2540">
  <line x1="40" y1="1155" x2="66" y2="1155" stroke="#0f2540" stroke-width="2.5"/>
  <text x="74" y="1160">Casing / tubing</text>
  <line x1="270" y1="1155" x2="296" y2="1155" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text x="304" y="1160">Sucker rod</text>
  <circle cx="480" cy="1155" r="5" fill="#f59e0b"/>
  <text x="498" y="1160">Downhole pump</text>
</g>
</svg>
