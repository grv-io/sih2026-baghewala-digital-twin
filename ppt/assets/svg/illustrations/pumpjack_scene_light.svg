  <ellipse cx="600" cy="304" rx="25" ry="33"/>
</g>

<text x="70" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="30" fill="#0f2540">Baghewala Field — Dusk</text>
<text x="70" y="106" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#3d5a75">Sucker-rod pumpjack · Bikaner, Rajasthan</text>
</svg>
