<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600" role="img" aria-label="Pumpjack silhouette on Rajasthan dunes at dusk, Baghewala field">
<title>Baghewala Field — Dusk</title>
<defs>
  <linearGradient id="pjSkyLight" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#eaf1f8"/>
    <stop offset="55%" stop-color="#fdeedd"/>
    <stop offset="100%" stop-color="#fbe0bf"/>
  </linearGradient>
  <radialGradient id="pjGlowLight" cx="50%" cy="100%" r="60%">
    <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.45"/>
    <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
  </radialGradient>
  <filter id="pjBlurLight" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="7"/>
  </filter>
</defs>

<rect width="1600" height="600" fill="url(#pjSkyLight)"/>

<circle cx="800" cy="440" r="46" fill="#f59e0b"/>
<ellipse cx="800" cy="440" rx="440" ry="170" fill="url(#pjGlowLight)"/>

<path d="M0,460 C200,420 400,442 600,410 C850,372 1050,432 1250,404 C1400,388 1500,410 1600,398 L1600,600 L0,600 Z" fill="#94a3b8" opacity="0.55"/>
<path d="M0,502 C250,468 500,502 750,470 C950,446 1150,482 1350,460 C1470,446 1550,466 1600,458 L1600,600 L0,600 Z" fill="#0f2540" opacity="0.85"/>

<!-- pumpjack silhouette -->
<g stroke="#0f2540" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <rect x="925" y="197" width="52" height="34" rx="4" fill="#fdeedd"/>
  <line x1="650" y1="255" x2="950" y2="207"/>
  <path d="M650,255 C608,249 585,268 590,297 C592,313 610,321 629,317 L650,300"/>
  <line x1="629" y1="317" x2="629" y2="410"/>
  <line x1="770" y1="472" x2="800" y2="230"/>
  <line x1="830" y1="472" x2="800" y2="230"/>
  <line x1="784" y1="358" x2="816" y2="358"/>
  <line x1="742" y1="248" x2="860" y2="430"/>
  <circle cx="860" cy="430" r="34"/>
  <rect x="792" y="446" width="70" height="26" rx="3" fill="#fdeedd"/>
  <rect x="758" y="472" width="144" height="14" rx="2" fill="#fdeedd"/>
</g>

<g fill="#f59e0b">
  <circle cx="800" cy="230" r="4"/>
  <circle cx="629" cy="410" r="3.5"/>
  <circle cx="860" cy="430" r="3.2"/>
</g>

<g stroke="#0f2540" stroke-width="2.5" fill="none">
  <rect x="613" y="404" width="32" height="14" rx="2" fill="#fdeedd"/>
  <line x1="600" y1="440" x2="629" y2="440"/>
  <line x1="629" y1="418" x2="629" y2="486"/>
</g>

<g filter="url(#pjBlurLight)" fill="#f8fafc" opacity="0.7">
  <ellipse cx="601" cy="378" rx="17" ry="25"/>
