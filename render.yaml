services:
  - type: web
    name: baghewala-digital-twin
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./data/twin.db
      - key: CORS_ORIGINS
        value: "*"
      - key: ENV
        value: production
      - key: PORT
        value: 8000
      # Keep-alive: set this to the service's own public URL in the Render
      # dashboard after the first deploy (sync: false = not stored in git).
      - key: SELF_PING_URL
        sync: false
      - key: SELF_PING_MINUTES
        value: 10
# No `disk:` block on purpose: persistent disks are not available on the free
# plan. The SQLite run history lives on the container filesystem and resets on
# each deploy/restart, which is fine for the demo (every result is recomputed).
