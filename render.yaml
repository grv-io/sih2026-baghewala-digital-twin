services:
  - type: web
    name: baghewala-digital-twin
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./data/twin.db
      - key: CORS_ORIGINS
        value: "*"
      - key: ENV
        value: production
      - key: PORT
        value: 8000
    # No persistent disk on the free plan: the SQLite run history lives inside the
    # container and resets on each deploy. Fine for the demo; add a disk (paid) or
    # set DATABASE_URL to Postgres for persistence.
